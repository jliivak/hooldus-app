<!DOCTYPE html>
<html lang="et">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16191d">
<title>Hooldus</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hooldus">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#eceee9;--card:#fff;--ink:#16191d;--mute:#5d6671;--line:#d8dcdf;--soft:#f4f5f2;
  --in:#fff3b8;--inb:#cf9f00;--ok:#1d7a43;--okbg:#e1f2e6;--warn:#a85f00;--warnbg:#ffeccc;
  --hot:#bd2229;--hotbg:#fde2e2;--nav:#16191d;--navink:#fff;--navmute:#8f98a2;
  --c1:#3e464f;--c1t:#eceef2;--c2:#007f8c;--c2t:#e0f3f5;--c3:#724c99;--c3t:#f1ebf7;
  --r:14px;--alarm:#c4161c;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1012;--card:#171b1f;--ink:#e7eaed;--mute:#9aa3ad;--line:#2a3036;--soft:#1d2226;
    --in:#3b3313;--inb:#e3b82c;--ok:#52c585;--okbg:#13301e;--warn:#f1a640;--warnbg:#3b2a0f;
    --hot:#ff6d6d;--hotbg:#3e1618;--nav:#050607;--navink:#fff;--navmute:#7d8690;
    --c1:#aab5c1;--c1t:#1f252b;--c2:#38c2ce;--c2t:#0f2a2d;--c3:#b897e0;--c3t:#251d31;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num,.tm,.cd,.clock{font-variant-numeric:tabular-nums}
a{color:inherit}

/* päis */
header{position:sticky;top:0;z-index:20;background:var(--nav);color:var(--navink);
  padding:calc(8px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px),calc((100% - 640px)/2)) 8px max(14px,env(safe-area-inset-left,0px),calc((100% - 640px)/2))}
.hrow{display:flex;align-items:center;gap:10px}
.ralli{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-size:20px;font-weight:700;letter-spacing:.5px}
.bell{border:0;background:transparent;color:var(--navink);font-size:20px;padding:4px 2px;opacity:.55}
.bell.on{opacity:1}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid #4a525b;background:transparent;color:var(--navink);border-radius:99px;
  padding:5px 12px;font-size:14px;font-weight:600;white-space:nowrap;min-height:36px}
.chip.on{background:var(--navink);color:var(--nav);border-color:var(--navink)}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.status{font-size:12px;color:var(--navmute);margin-top:6px;min-height:16px}
.status.bad{color:#ff8a8a;font-weight:700}
.status.pend{color:#f1c86a}

main{padding:12px max(12px,env(safe-area-inset-right,0px)) calc(92px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* alumine menüü */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);display:flex;
  padding:6px max(6px,env(safe-area-inset-right,0px),calc((100% - 640px)/2)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px),calc((100% - 640px)/2))}
nav button{flex:1;border:0;background:transparent;color:var(--navmute);display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0;font-size:12px;font-weight:600;border-radius:10px}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--navink);background:#ffffff14}

/* kaardid */
.card{background:var(--card);border-radius:var(--r);overflow:hidden;overflow:clip;box-shadow:0 1px 2px #0000000f}
.pad{padding:14px 16px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)}
.small{font-size:14px}
.h2{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:10px 4px -4px}

/* sõit */
.trip{border-left:6px solid var(--ink)}
.trip .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:2px}
.trip .lahku{font-size:30px;font-weight:800;letter-spacing:-.5px}
.trip .cd{font-size:44px;font-weight:800;line-height:1.05;letter-spacing:-1px}
.trip .cdl{font-size:14px;color:var(--mute);font-weight:600}
.tasks{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-weight:600}
.tasks li{display:flex;gap:8px;align-items:baseline}
.route{margin-top:8px;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;
  padding:12px 16px;font-weight:700;font-size:16px;text-decoration:none;min-height:48px}
.btn.waze{background:#33ccff;color:#05202b;margin-top:12px;width:100%}
.btn.dark{background:var(--ink);color:var(--card)}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.then{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;color:var(--mute)}
.u10{background:var(--warnbg)!important}
.u10 .cd{color:var(--warn)}
.u5{background:var(--hotbg)!important}
.u5 .cd{color:var(--hot)}
.u0{background:var(--alarm)!important;color:#fff!important}
.u0 .cd,.u0 .mute,.u0 .cdl,.u0 .lbl{color:#fff!important}
@keyframes pulse{50%{opacity:.55}}
.u0 .cd{animation:pulse 1s infinite}

/* auto kaart */
.car{border-top:6px solid var(--cc)}
.car .chead{background:var(--ct);padding:10px 16px;display:flex;align-items:center;gap:10px}
.car .cnr{font-size:22px;font-weight:900;color:var(--cc)}
.car .cname{font-weight:700;flex:1;min-width:0}
.car .cname small{display:block;font-weight:500;color:var(--mute);font-size:13px}
.state{padding:12px 16px 4px}
.state .st{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--cc)}
.state .sv{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.state .stime{font-size:22px;font-weight:800}
.state .cd{font-size:30px;font-weight:800}
.state.run{background:var(--ct)}
.where{padding:2px 16px 10px;font-size:14px;color:var(--mute)}
.svc{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.svhead{display:flex;align-items:center;gap:10px}
.svhead .t{flex:1;min-width:0}
.svhead .t b{font-size:17px}
.done-btn{border:2px solid var(--ok);background:transparent;color:var(--ok);border-radius:12px;padding:8px 12px;font-weight:800;min-height:44px;white-space:nowrap}
.done-btn.on{background:var(--ok);color:#fff}
.lights{border-radius:10px;padding:10px 12px;font-weight:900;font-size:17px;background:var(--warnbg);color:var(--warn);letter-spacing:.02em}
.line{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.line .i{flex:none;width:22px;text-align:center}
.warnline{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.logs{display:flex;flex-direction:column;gap:6px}
.logitem{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:10px;padding:8px 10px}
.logitem .tx{flex:1;min-width:0;overflow-wrap:break-word;hyphens:auto}
.logitem .meta{font-size:12px;color:var(--mute)}
.logitem.ok .tx{text-decoration:line-through;color:var(--mute)}
.cb{flex:none;width:40px;height:40px;border-radius:9px;border:2px solid var(--mute);background:var(--card);
  display:grid;place-items:center;font-weight:900;color:#fff;font-size:18px;padding:0}
.cb.on{background:var(--ok);border-color:var(--ok)}
.press{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.press .pl{font-weight:700;flex:1 1 100%}
.field{display:flex;align-items:center;gap:6px}
.inp{background:var(--in);border:2px solid var(--inb);border-radius:10px;padding:8px 10px;min-height:44px;outline:none;width:100%}
.inp:focus{box-shadow:0 0 0 3px #cf9f0040}
.inp.n{width:74px;text-align:center;font-weight:800;font-size:18px}
textarea.inp{resize:vertical;min-height:64px}
.save{background:var(--inb);color:#1b1500;border:0;border-radius:10px;font-weight:800;padding:0 14px;min-height:44px}
.save[hidden]{display:none}
.linkbtn{border:0;background:transparent;color:var(--cc);font-weight:700;padding:4px 0;text-align:left;min-height:40px}

/* kõik hooldused */
.slist{display:flex;flex-direction:column}
.srow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:15px}
.srow:first-child{border-top:0}
.srow .bar{width:5px;align-self:stretch;border-radius:3px;background:var(--cc)}
.srow .n{font-weight:900;color:var(--cc);width:28px}
.srow .s{flex:1;min-width:0}
.srow.past{opacity:.5}
.srow.now{background:var(--ct)}
.pill{font-size:12px;font-weight:800;border-radius:99px;padding:2px 8px;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.run{background:var(--cc);color:var(--card)}
.pill.next{background:var(--ink);color:var(--card)}

/* ajakava */
.seg{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:var(--hh,96px);z-index:3;background:var(--bg);margin:-12px 0 -4px;padding:10px 0 8px}
.seg button{border:2px solid var(--cc);background:var(--card);color:var(--cc);border-radius:99px;padding:6px 14px;font-weight:800}
.seg button.on{background:var(--cc);color:var(--card)}
.sched{display:flex;flex-direction:column}
.card.sched{overflow:visible}   /* overflow:hidden teeks kaardist kerimisala ja kleepuv päevapäis nihkuks kaardi sisse */
.sched>:first-child{border-radius:var(--r) var(--r) 0 0}
.sched>:last-child{border-radius:0 0 var(--r) var(--r)}
.day{background:var(--ink);color:var(--card);padding:8px 14px;font-weight:800;font-size:13px;letter-spacing:.04em;position:sticky;top:calc(var(--hh,96px) + var(--sh,0px));z-index:2}
.srw{display:grid;grid-template-columns:52px 46px 1fr;gap:8px;padding:9px 12px;border-top:1px solid var(--line);align-items:start}
.srw .tm{font-weight:800}
.srw .ak{font-weight:700;color:var(--mute);font-size:14px}
.srw .ms{min-width:0;overflow-wrap:break-word;hyphens:auto}
.srw .ms small{display:block;color:var(--mute);font-size:13px}
.srw.SS .ms{font-weight:800}
.srw.SERVICE{background:var(--ct)}
.srw.SERVICE .ms{font-weight:700;color:var(--cc)}
.srw.RZ{background:var(--warnbg)}
.srw.RZ .ms{color:var(--warn);font-weight:700}
.srw.PF .ms{font-weight:700}
.srw.past{opacity:.45}
.srw.next{outline:3px solid var(--cc);outline-offset:-3px;opacity:1}
.tmb{border:0;background:transparent;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline dotted 1.5px;text-decoration-color:var(--mute);text-underline-offset:4px;text-align:left;min-height:40px;min-width:48px}
.tmb .ed{font-size:12px;color:var(--warn);margin-left:2px}
.srw .plan{display:block;font-size:11px;color:var(--mute);font-weight:600}
.aegedit{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--in);border:2px solid var(--inb);border-radius:10px;padding:10px;margin-top:6px}
.aegedit .tin{display:flex;align-items:center;gap:4px}
.aegedit input{font-size:22px;font-weight:800;min-height:44px;width:92px;text-align:center;border-radius:8px;border:1px solid var(--inb);padding:4px 6px;background:var(--card);font-variant-numeric:tabular-nums}
.adj{min-width:44px;min-height:44px;border-radius:8px;border:1px solid var(--inb);background:var(--card);font-weight:800;font-size:15px;padding:0 6px}
.aegedit .small{flex:1 1 100%}
.nextb{display:block;width:fit-content;margin-top:4px;background:var(--cc);color:var(--card);font-size:12px;font-weight:800;border-radius:99px;padding:2px 8px}

/* info */
.toc{display:flex;gap:6px;flex-wrap:wrap}
.toc button{flex:none}
.toc{position:sticky;top:var(--hh,96px);z-index:3;background:var(--bg);padding:4px 0}
.toc button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 10px;font-weight:700;font-size:14px}
.toc button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.rowi{display:flex;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.rowi:first-child{border-top:0}
.rowi .s{flex:1;min-width:0}
.rowi.past{opacity:.45}
.tel{font-weight:800;text-decoration:none;white-space:nowrap;background:var(--okbg);color:var(--ok);padding:11px 12px;border-radius:10px;display:inline-block}
.wz{font-weight:800;text-decoration:none;white-space:nowrap;background:#33ccff;color:#05202b;padding:11px 12px;border-radius:10px;display:inline-block}
dl{margin:0}
dl div{padding:9px 14px;border-top:1px solid var(--line)}
dl div:first-child{border-top:0}
dt{font-weight:800}
dd{margin:0;color:var(--mute);font-size:15px}
.form{display:flex;flex-direction:column;gap:8px;padding:12px 14px;background:var(--soft)}
.frow{display:flex;gap:8px}
.frow > *{flex:1;min-width:0}
select.inp{appearance:auto}
.tg{border:2px solid var(--cc);background:transparent;color:var(--cc);border-radius:9px;padding:4px 8px;font-weight:800;min-width:46px;min-height:36px;font-size:14px}
.tg.on{background:var(--cc);color:var(--card)}
.kitem{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line)}
.kitem .s{flex:1;min-width:0;overflow-wrap:break-word;hyphens:auto}
.ksec{padding:10px 14px 6px;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:var(--soft);border-top:1px solid var(--line)}
.ksec small{display:block;text-transform:none;letter-spacing:0;font-weight:600;color:var(--mute)}
.badge{font-size:12px;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--soft);border:1px solid var(--line)}
.oht{color:var(--hot);font-weight:800}
.ki{display:block;font-size:13px;font-weight:600;margin-top:4px;color:var(--ink)}
.ki.oht{color:var(--hot);font-weight:800}
.ki .mute{font-weight:600}
.kib{display:block;width:fit-content;margin-top:6px;border:1px dashed var(--line);background:transparent;color:var(--mute);border-radius:99px;padding:4px 12px;font-weight:700;font-size:13px;min-height:40px}
.empty{padding:14px 16px;color:var(--mute)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-weight:700;font-size:15px;max-width:92vw;
  box-shadow:0 6px 20px #0004;transition:opacity .2s;opacity:0;pointer-events:none}
#toast.show{opacity:1}
#toast.bad{background:var(--alarm);color:#fff}
#alarm{position:fixed;inset:0;z-index:40;background:var(--alarm);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#alarm .a1{font-size:28px;font-weight:900}
#alarm .a2{font-size:18px;font-weight:600}
#alarm button{background:#fff;color:var(--alarm);border:0;border-radius:14px;padding:14px 26px;font-weight:900;font-size:18px}
.loading{padding:40px 16px;text-align:center;color:var(--mute)}
.svsum{border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;font-size:14px}
.svsum .s{flex:1;min-width:0;color:var(--mute)}
.svsum .s b{color:var(--ink)}
.svsum .go{flex:none;font-weight:800;color:var(--cc);white-space:nowrap}
.svsum .wl{color:var(--warn);font-weight:800}
.prestart{padding:0 16px 12px;display:flex;flex-direction:column;gap:6px}
.prestart .warnline{font-size:15px}
.hint{font-size:13px;color:var(--mute);padding:0 4px}
.cbadge{flex:none;min-width:30px;text-align:center;font-size:13px;font-weight:900;border-radius:7px;padding:3px 5px;background:var(--cc);color:var(--card);align-self:flex-start;margin-top:4px}
.logseg{display:flex;gap:6px;flex-wrap:wrap}
.logseg button{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:2px solid var(--cc);background:var(--card);color:var(--cc);border-radius:99px;padding:6px 8px;font-weight:800;min-height:40px}
.logseg button.on{background:var(--cc);color:var(--card)}
.tg.cbx{min-width:36px;width:36px;padding:0;font-size:18px}
.kyb{display:block;width:fit-content;margin-top:6px;border:1px solid var(--inb);background:var(--in);color:var(--ink);border-radius:99px;padding:4px 12px;font-weight:700;font-size:13px;min-height:40px}
.cb.pend{border-color:var(--line);background:transparent;font-size:16px}
.cal{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.calb{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-decoration:none;font-size:16px;font-weight:800;padding:0 6px}
.calb.on{border-color:var(--ok);color:var(--ok)}
.calb.vana{border:2px solid var(--hot);color:var(--hot);background:var(--hotbg)}
.calwarn{background:var(--hotbg);color:var(--hot);font-weight:800}
.calwarn .rowi{border-top:1px solid var(--line)}
.calbtns{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 100%}
.calbtns .btn{flex:1 1 140px}
.artop{display:flex;gap:8px;align-items:center}
.artop .tx{flex:1;min-width:0}
.cal > div{flex:1 1 220px;min-width:0}
.cal .btn{flex:none}
/* signaalid */
.sig{padding:12px 16px;display:flex;gap:10px;align-items:baseline;font-weight:900;font-size:19px;line-height:1.25}
.sig .tx{flex:1;min-width:0;overflow-wrap:break-word}
.sig .tx small{display:block;font-size:15px;font-weight:700;margin-top:2px}
.sig .num{font-size:15px;font-weight:800;white-space:nowrap}
.sig.ok{background:var(--okbg);color:var(--ok)}
.sig.hot{background:var(--hotbg);color:var(--hot)}
.sig.dnf{background:var(--alarm);color:#fff}
.sig.tyh{background:var(--soft);color:var(--mute);text-decoration:none}
.sig .tyhb{flex:none;border:2px solid currentColor;background:transparent;color:inherit;border-radius:10px;font-weight:900;font-size:14px;min-height:40px;padding:0 10px}
.sig .nah{flex:1 1 100%;font-size:14px;font-weight:800;margin-top:6px}
.sig .nahb{flex:1 1 100%;margin-top:8px;border:0;background:#fff;color:#000;border-radius:10px;font-weight:900;font-size:16px;min-height:48px}
.sig .tyhb.k{background:#fff;color:var(--alarm);border-color:#fff}
.sigb{border-top:1px solid var(--line);padding:10px 16px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sigb .pl{flex:1 1 100%;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.sg{flex:1 1 auto;border:2px solid var(--sc);color:var(--sc);background:transparent;border-radius:10px;font-weight:900;min-height:44px;padding:0 6px;font-size:13px;white-space:nowrap}
.sg.on{background:var(--sc);color:#fff}
.sg.ok{--sc:var(--ok)}.sg.hot{--sc:var(--hot)}.sg.dnf{--sc:var(--alarm)}
@media (prefers-color-scheme: dark){.sg.dnf{--sc:#ff6b6b}.sg.dnf.on{color:#1a0d0d}}

.dbs li.hot{color:var(--hot);font-weight:700}
.dbs li.ok{color:var(--ok)}
.dbbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dbbtn .btn{flex:1 1 140px}
@media print{
  header,nav,.toc,.dbbtn,#toast{display:none!important}
  html,body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}

}
.minu{padding:14px 16px}

.sea .lbl{margin-bottom:6px}

.morebtn{border:0;border-top:1px solid var(--line);background:transparent;width:100%;padding:12px 14px;font-weight:700;color:var(--mute);text-align:left}

<script>window.HOOLDUS_PWA={"api":"https://script.google.com/macros/s/AKfycbyNBrLT01bUyKJPuUEWmnR2NAznLCGshwdVDUslmlXynrMGAUtZzK0TPNXGB0UhIWCI/exec"};</script>
<script>

const VOTI_RAW = (document.getElementById('cfg') || {}).dataset ? document.getElementById('cfg').dataset.k || '' : '';
// PWA (eraldi sait, tools/pwa.js): võti ja API aadress tulevad lingi #k=…&a=… osast (see ei lähe serverisse) ja jäävad telefoni meelde.

let D = null, offset = 0, lastOk = 0, lastErr = '';

let infoTab = LS.get('infoTab', 'soidud') === 'katsed' ? 'soidud' : LS.get('infoTab', 'soidud'), editAeg = null, editKy = null, logAuto = LS.get('logAuto', null), showPast = false, ideeLiik = 'Idee', sigOpen = null, dbTekst = null, editKatse = null, muudaKatse = null, kustutaKatse = null, logTab = LS.get('logTab', 'logi');

/* ------------------------------------------------------------ server */
// Iga päring kannab ralli tunnust (D.rid): server ei kirjuta vana ralli ootel muudatust uue ralli tabelisse.
function call(fn, ...args) { return callR(D ? D.rid : '', fn, ...args); }

  D = JSON.parse(json);
  if (cached) { offset = 0; lastOk = cached; }
  else {
    const diff = D.now - Date.now();
    offset = Math.abs(diff) > 90000 ? diff : 0;
    lastOk = Date.now(); lastErr = '';
    LS.set('snap', { at: lastOk, json: json });
  }
  if (!cached && D.rid) {
    const vana = LS.get('rid', '');
    if (vana && vana !== D.rid) ralliVahetus();
    LS.set('rid', D.rid);
  }
  setTz(D.tz || 'Europe/Tallinn');
  if (filter !== 'koik' && !D.autod.some(a => String(a.koht) === filter)) filter = 'koik';
  if (minu && minu !== 'koik' && !D.autod.some(a => String(a.koht) === minu)) { minu = null; LS.set('minu', null); }

/* ---- ootel muudatused: salvestuvad telefoni ja saadetakse, kui levi on */
let Q = LS.get('q', []), flushing = false;

function send(fn, args, msg) {

  Q.push(op); saveQ();
  overlay(op); render();

}
function flush() {
  if (flushing || !Q.length) return;

    apply(j);
    toast(Q.length ? op.msg + ' · ootel veel ' + Q.length : op.msg || 'Salvestatud ✓');
    flush();
  }).catch(e => {
    flushing = false;

  });

  minu = null; LS.set('minu', null); filter = 'koik'; LS.set('filter', filter); ajAuto = null; LS.set('ajAuto', null); logAuto = null; LS.set('logAuto', null);

/** Ootel muudatuse mõju kohe ekraanile (enne kui server kinnitab). */
function overlay(op) {
  if (!D) return;

  try {
    if (op.fn === 'setServiceDone') { const h = D.hooldused.find(x => x.rida === a[0]); if (h) { h.tehtud = a[1]; h.ootel = true; } }

        <input class="inp" id="pwaK" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Link või võti" aria-label="Link või võti">

/* ---- SIGNAALID: sõitja annab katse järel märku, mehaanikute telefonid näitavad suurt riba */
const SIG = { OK: ['✓', 'OK', 'ok'], PROBLEEM: ['⚠', 'PROBLEEM', 'hot'], KATKESTASIME: ['✖', 'KATKESTASIME', 'dnf'] };
function lastSig(a) { return (D.signaalid || []).find(x => x.nr === a.nr); }
function sigBanner(a) {
  const x = lastSig(a), n = now();
  if (!x || n - x.t > 6 * 3600000) return '';
  if (x.signaal === 'OK') { if (n - x.t > 30 * MIN) return ''; boundary(x.t + 30 * MIN); }
  const g = SIG[x.signaal];
  if (x.tyh) { if (n - x.t > 30 * MIN) return ''; return `<div class="sig tyh"><span class="tx">${g[0]} ${esc(x.kus)} ${g[1]} · TÜHISTATUD<small>Valesti saadetud (${esc(x.tyh)}). Kõik on korras.</small></span><span class="num">${esc(x.aeg)}</span></div>`; }
  const key = x.nr + '|' + x.t, kinnita = sigTyh === key;
  const nah = x.signaal === 'OK' ? '' : x.nahtud ? `<span class="nah">👁 Mehaanikud nägid ${esc(x.nahtud)}</span>`
    : saabKinnitada(x) ? `<button class="nahb" data-act="signahtud" data-nr="${esc(x.nr)}" data-t="${x.t}">👁 Nähtud, tegeleme</button>`
    : x.ootel ? '' : '<span class="nah">⏳ Mehaanikud pole veel kinnitanud</span>';
  const tb = x.signaal !== 'OK' && !x.ootel && minuSignaal(x) ? `<button class="tyhb ${kinnita ? 'k' : ''}" data-act="sigtyh" data-nr="${esc(x.nr)}" data-t="${x.t}">${kinnita ? 'Jah, tühista' : 'Tühista'}</button>` : '';
  return `<div class="sig ${g[2]}" style="flex-wrap:wrap"><span class="tx">${g[0]} ${esc(x.kus)} ${g[1]}${x.tekst ? `<small>${esc(x.tekst)}</small>` : ''}${kinnita ? '<small>Valesti saadetud? Vajuta veel kord.</small>' : ''}</span><span class="num">${x.ootel ? '⏳' : esc(x.aeg)}</span>${tb}${x.ll ? geoLinks(x) : ''}${nah}</div>`;
}
function geoLinks(x) {
  const b = 'https:' + '/' + '/';
  return `<div class="geo" style="flex:1 1 100%"><a href="${b}waze.com/ul?ll=${x.ll}&navigate=yes" target="_blank" rel="noopener">📍 Waze autoni</a><a href="${b}www.google.com/maps/search/?api=1&query=${x.ll}" target="_blank" rel="noopener">🗺 Kaart${x.tapsus ? ' ±' + esc(x.tapsus) + ' m' : ''}</a></div>`;
}
function sigBar(a) {
  const o = sigOpen && sigOpen.koht === a.koht ? sigOpen.sg : '';
  const btn = Object.keys(SIG).map(k => `<button class="sg ${SIG[k][2]} ${o === k ? 'on' : ''}" data-act="sigopen" data-koht="${a.koht}" data-sg="${k}">${SIG[k][0]} ${SIG[k][1]}</button>`).join('');
  const valik = D.katseValik.length ? D.katseValik : [''], lk = lastSS(a);
  const form = o ? `<div class="sigform">
      <select class="inp" id="sgKus">${valik.map(v => `<option ${v === lk ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>
      <input class="inp" id="sgTx" maxlength="200" placeholder="${o === 'OK' ? 'Lisainfo (pole kohustuslik)' : o === 'PROBLEEM' ? 'Mis viga? Nt „parem esirehv“' : 'Kus oleme? Nt „km 8, auto ohutult teelt väljas“'}">
      ${geoLine(o)}
      <div class="frow"><button class="btn dark" data-act="sigsend" data-koht="${a.koht}" data-sg="${o}">Saada ${SIG[o][1]}</button><button class="btn ghost" style="flex:none" data-act="sigcancel">Loobu</button></div>
    </div>` : '';
  return `<div class="sigb"><span class="pl">📣 Sõitjalt mehaanikutele · ${esc(a.nr)}</span>${btn}${form}</div>`;
}
/** Telefoni GPS signaali juurde: KATKESTASIME puhul otsib kohe, teistel nupuga. */
function geoStart() {
  if (!navigator.geolocation) { sigGeo = { st: 'viga', viga: 'Telefon ei anna asukohta' }; keepRender(); return; }
  sigGeo = { st: 'otsin' }; keepRender();
  navigator.geolocation.getCurrentPosition(p => {
    if (!sigOpen) return;
    sigGeo = { st: 'ok', ll: p.coords.latitude.toFixed(5) + ',' + p.coords.longitude.toFixed(5), tapsus: Math.round(p.coords.accuracy) };
    keepRender();
  }, e => {
    if (!sigOpen) return;
    sigGeo = { st: 'viga', viga: e && e.code === 1 ? 'Asukoha luba puudub (brauseri seaded)' : 'Asukohta ei leitud' };
    keepRender();
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
}
/** Uuenda ainult asukoha rida (tekstikast võib olla fookuses, siis render() ootab). */
function keepRender() { const e = document.querySelector('.geol'); if (e) e.outerHTML = geoLine(); else render(); }
function geoLine(o) {
  const g = sigGeo;
  if (!g) return `<div class="geol"><button class="btn ghost" style="min-height:40px;padding:0 12px;flex:none" data-act="geo">📍 Lisa asukoht</button><span class="small mute">mehaanikud saavad navigeerida autoni</span></div>`;
  if (g.st === 'otsin') return '<div class="geol">📍 Otsin asukohta…</div>';
  if (g.st === 'ok') return `<div class="geol ok">📍 Asukoht lisatud · täpsus ±${esc(g.tapsus)} m</div>`;
  return `<div class="geol viga">📍 ${esc(g.viga)}. Kirjuta, kus olete (km, tee).<button class="btn ghost" style="min-height:40px;padding:0 12px;flex:none" data-act="geo">Proovi uuesti</button></div>`;
}
/** Uued signaalid teistelt telefonidelt → suur hoiatus (OK = teade). */
function sigCheck() {
  const L = D.signaalid || [];
  if (!L.length) return;
  // minu saadetud signaal sai kinnituse → teade (üks kord)
  L.forEach(x => {
    const key = x.nr + '|' + x.t;
    if (!x.nahtud || !minuSignaal(x) || nahtudTeada.indexOf(key) >= 0) return;
    nahtudTeada.push(key); LS.set('nahtudTeada', nahtudTeada.slice(-30));
    toast('👁 Mehaanikud nägid: ' + x.kus + ' ' + x.signaal + ' (' + x.nahtud + ')'); if (heli) beep(2);
  });
  const top = Math.max(...L.map(x => x.t));
  if (!sigSeen) { sigSeen = top; LS.set('sigSeen', sigSeen); return; }
  const uued = L.filter(x => x.t > sigSeen && !x.ootel && !x.tyh).reverse();
  if (!uued.length) return;
  sigSeen = top; LS.set('sigSeen', sigSeen);
  uued.forEach(x => {
    const mk = x.nr + '|' + x.signaal + '|' + x.kus, i = sigMine.indexOf(mk);
    if (i >= 0) { sigMine.splice(i, 1); return; }
    const a = carByNr(x.nr);
    if (a && filter !== 'koik' && String(a.koht) !== filter) return;
    const g = SIG[x.signaal];
    if (x.signaal === 'OK') { toast(g[0] + ' ' + x.nr + ' · ' + x.kus + ' OK ' + x.aeg); if (heli) beep(1); }
    else { const kin = saabKinnitada(x); alarm(x.nr + ' · ' + x.kus + ' ' + g[1], x.tekst || x.aeg, 0, g[0], kin ? '👁 Nähtud, tegeleme' : 'Selge'); alarmSig = kin ? x : null; }
  });
}

/* ---- STANDARDTÖÖD hoolduse kaardil */
/* Standardtööde vajutused kogutakse kokku ja saadetakse 1,5 s pärast viimast vajutust ühe päringuga. */
const kPend = {}, kTimer = {};
function kOver() { Object.keys(kPend).forEach(r => { const h = D.hooldused.find(x => x.rida === Number(r)); if (h) { h.kontroll = kPend[r].slice(); h.ootel = true; } }); }
function kSend(r) {
  clearTimeout(kTimer[r]); delete kTimer[r];
  const L = kPend[r]; if (!L) return; delete kPend[r];
  // ootel (veel saatmata) sama hoolduse märked asenduvad uuega
  for (let i = Q.length - 1; i >= (flushing ? 1 : 0); i--) if (Q[i].fn === 'setKontroll' && Q[i].args[0] === Number(r)) Q.splice(i, 1);
  save('setKontroll', [Number(r), L], 'Standardtööd ' + L.length + '/' + (D.kontroll || []).length + ' ✓');
}
function kSendAll() { Object.keys(kPend).forEach(kSend); }
function chkBlock(h) {

/* ---- KALENDER: iga sündmus eraldi, rakendus jätab meelde lisatud aja ja annab märku, kui see muutub.
   Hetkel välja lülitatud (KALENDER = false): nuppe, hoiatust ega Info kaarti ei näidata. Server (?ics=1) töötab edasi. */
const KALENDER = false;
const kalSig = (ev, x) => ev.indexOf('ho-') === 0 ? x.sisse + '|' + x.valja : String(x.lahku || '');
function kalHref(ev, koht) {

/** Sõidud sama lahkumisajaga = üks kalendrisündmus. */
const soitGrupp = t => D.soidud.filter(x => x.lahku && x.lahku === t.lahku && tripVisible(x));
function kalBtn(ev, x) {

  if (!L.length) L.push([ev, x]);

  const k = L.every(p => kal[p[0]]), vana = L.some(p => kal[p[0]] && kal[p[0]] !== kalSig(p[0], p[1]));
  return `<a class="calb ${vana ? 'vana' : k ? 'on' : ''}" href="${kalHref(evs)}" target="_blank" rel="noopener" data-act="kal" data-ev="${evs}" aria-label="${vana ? 'Uuenda kalendris' : 'Lisa kalendrisse'}">${vana ? '📅⟳' : k ? '📅✓' : '📅'}</a>`;
